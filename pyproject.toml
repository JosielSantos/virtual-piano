readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pyFluidSynth>=1.3.4,<2",
    "pygame>=2.6.1,<3",
    "wxPython>=4.2.3,<5",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.16,<7",
]

[tool.uv]
package = false
